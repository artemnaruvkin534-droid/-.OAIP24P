<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
</head>
<body>

<h1>{{ movie.title }}</h1>

<p>Год выпуска: {{ movie.year }}</p>
<p>Жанр: {{ movie.genre }}</p>
<p>Описание: {{ movie.description }}</p>
<p>Рейтинг: {{ movie.rating }}
    {% if movie.rating >= 8.5 %}
        <strong>— Рекомендуем посмотреть</strong>
    {% endif %}
</p>

<a href="/">Назад</a>

</body>
</html>
